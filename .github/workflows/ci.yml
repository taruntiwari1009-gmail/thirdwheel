name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "portfolio/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Supabase application tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run application tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Verify Supabase schema and client security boundaries
        run: npm run test:supabase

      - name: Build application
        run: npm run build
