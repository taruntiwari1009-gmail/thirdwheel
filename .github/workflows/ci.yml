name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "portfolio/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Application tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run application tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build application
        run: npm run build

  firebase-rules:
    name: Firebase Emulator security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Firestore and Storage security tests
        run: npx --yes firebase-tools@13.35.1 emulators:exec --project demo-thirdwheel --only auth,firestore,storage "npm run test:rules"

  trusted-functions:
    name: Trusted backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Test trusted backend validation
        working-directory: functions
        run: npm test
