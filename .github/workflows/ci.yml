name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "portfolio/**"
      - "fix/netlify-ci-lint-pr13"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-build:
    name: Application tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and refresh dependencies
        run: npm install --no-audit --no-fund

      - name: Commit refreshed lockfile on the working branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/netlify-ci-lint-pr13'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm lockfile"
          git push origin HEAD:fix/netlify-ci-lint-pr13

      - name: Run application tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build application
        run: npm run build
